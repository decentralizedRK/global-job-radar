name: Monitor Target Company Careers

on:
  schedule:
    # Run every Monday and Thursday at 8 AM IST (2:30 AM UTC)
    - cron: '30 2 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor company careers pages
        run: |
          cd scripts
          python main.py --sources careers --no-notify

      - name: Check for new positions
        id: check_new
        run: |
          cd scripts
          python3 -c "
          import json
          from pathlib import Path

          results_file = Path('../results/all_results.json')
          if not results_file.exists():
              print('new_count=0')
              exit()

          with open(results_file) as f:
              data = json.load(f)

          new_jobs = [j for j in data['jobs'].values()
                      if j.get('source') == 'careers_page'
                      and j.get('seen_count', 0) <= 1]

          print(f'new_count={len(new_jobs)}')

          if new_jobs:
              print('## New Positions from Target Companies')
              for job in sorted(new_jobs, key=lambda x: x.get('match_score', 0), reverse=True):
                  print(f'- **{job[\"title\"]}** at {job[\"company\"]} (Score: {job.get(\"match_score\", 0)})')
          " >> "$GITHUB_OUTPUT"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update company monitor results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
