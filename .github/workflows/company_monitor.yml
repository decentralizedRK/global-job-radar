name: Monitor Target Company Careers

on:
  schedule:
    # Run every Monday and Thursday at 8 AM IST (2:30 AM UTC)
    - cron: '30 2 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor company careers pages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd scripts
          python main.py --sources careers

      - name: Check for new positions
        id: check_new
        run: |
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path

          results_file = Path('results/all_results.json')
          gh_output = os.environ.get('GITHUB_OUTPUT', '')

          if not results_file.exists():
              if gh_output:
                  with open(gh_output, 'a') as f:
                      f.write('new_count=0\n')
              exit()

          with open(results_file) as f:
              data = json.load(f)

          new_jobs = [j for j in data['jobs'].values()
                      if j.get('source') in ('careers_page', 'google_company_search')
                      and j.get('seen_count', 0) <= 1]

          if gh_output:
              with open(gh_output, 'a') as f:
                  f.write(f'new_count={len(new_jobs)}\n')

          if new_jobs:
              print(f'Found {len(new_jobs)} new positions from target companies:')
              for job in sorted(new_jobs, key=lambda x: x.get('match_score', 0), reverse=True):
                  print(f'  - {job["title"]} at {job["company"]} (Score: {job.get("match_score", 0)})')
          else:
              print('No new positions found this run')
          PYEOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update company monitor results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
