name: Expat Network Finder

on:
  schedule:
    # Run weekly on Wednesday at 7 AM IST (1:30 AM UTC)
    - cron: '30 1 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run expat finder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd scripts
          python expat_finder.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --staged --quiet; then
            echo "No new profiles"
          else
            git commit -m "chore: update expat profiles $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
